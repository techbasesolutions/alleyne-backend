name: keep-backend-warm

# Render's free tier spins the service down after ~15 minutes idle, and a cold
# start takes ~40s. This pings the health endpoint every 10 minutes so the demo
# stays responsive. Remove this once the service moves to a paid (always-on) plan.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://alleyne-backend.onrender.com/_health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "$URL" || echo "000")
            echo "ping $i -> $code"
            if [ "$i" -lt 6 ]; then sleep 60; fi
          done
